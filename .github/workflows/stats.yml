name: Generate stats card

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats_card.py", ".github/workflows/stats.yml"]

concurrency:
  group: profile-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS_TOKEN: ${{ secrets.PRS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/stats_card.py
      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/trophies.svg assets/hud.svg
          git diff --cached --quiet || git commit -m "Update stats and trophies cards"
          git pull --rebase -q && git push
